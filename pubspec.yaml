name: cosecha_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Utilidades UI
  google_fonts: ^6.3.2
  intl: ^0.20.2
  # Navegacion
  go_router: ^17.0.0
  # Backend & Conexion
  supabase_flutter: ^2.12.0
  # Exportación Excel
  excel: ^4.0.6
  share_plus: ^12.0.1
  # Gestión de Estado
  provider: ^6.1.5+1    # MVVM sencillo y efectivo
  # Base de Datos Local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.0.0
  # graficas
  fl_chart: ^0.69.0
  file_picker: ^10.3.10
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/

flutter_launcher_icons:
  image_path: "assets/icon/logo-cosecha.png"
  
  # Android
  android: true 
  min_sdk_android: 21 
  
  # iOS (Apple no permite transparencias, usamos fondo blanco)
  ios: true 
  remove_alpha_ios: true          
  background_color_ios: "#ffffff" 

  # Web
  web:
    generate: true
    image_path: "assets/icon/logo-cosecha.png"
    background_color: "#FFFFFF"
    theme_color: "#2F7F34" # El color verde principal de tu app